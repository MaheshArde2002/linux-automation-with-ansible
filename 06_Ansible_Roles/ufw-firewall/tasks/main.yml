# tasks file for ufw-firewall
---
- name: Install UFW Firewall
  apt:
    name: "{{ firewall_package_name }}"
    state: present
    update_cache: yes
  become: true

- name: Allow HTTP Service in Firewall
  community.general.ufw:
    rule: allow
    port: "{{ firewall_port }}"
    proto: "{{ firewall_protocol }}"
  become: true
  notify: Reload Firewall
